[PatreonBridge]
Enabled=0
BaseUrl=http://localhost:4000
ServiceToken=
[AccountBridge]
'Prende el poll periodico de operaciones de cuenta desde la web (alta/password/borrado)
Enabled=1
'Prende el canal mao-ops del Mercado de Personajes (lock/unlock/transfer de personaje).
'SIN esta clave el server NO aplica ninguna operacion del mercado y la web cobra
'igual: un deploy nuevo arrancaba cobrando y sin entregar nada (plan 30.001, ola 0).
'El server publica este valor en el header X-Game-Mao-Enabled del poll, asi que la
'web ya no depende de que las dos configuraciones coincidan.
MaoEnabled=1
'URL base del servicio web (ao20-patreon-commerce)
BaseUrl=http://localhost:4000
'Token compartido con la web para autenticar el bridge (header X-Service-Token)
ServiceToken=
'URL de registro mostrada al intentar crear cuenta in-game
RegisterUrl=https://nuevaeticaao.com/registro
'Fallback: habilita el alta de cuenta in-game si la web esta caida
AllowIngameRegistration=0

' Plantilla de Guardian.secret.ini (el real esta gitignoreado: NUNCA commitear secretos).
' Lo lee modGuardian.bas junto a Configuracion.ini. Archivo ausente o sin la clave del kid = ese kid se rechaza.
[GUARDIAN]
' PermitirDev=1 acepta el kid 0 (secreto de prueba PUBLICO de tools/antitrampa/guardian_vectores.json). Solo en desarrollo.
PermitirDev=0
' Sal con la que se re-hashea el id de PC antes de loguearlo.
SaltLog=CAMBIAR
' Hasta 2 claves KidN=<64 hex>. N = id de secreto (1..255) que compilo el guardian de release.
'Kid1=<64 hex>
